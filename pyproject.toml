[project]
name = "deeplib"
version = "1.0.0"
authors = [{name = "Nick Seinsche", email = "nick.seinsche@gmail.com"}]
description = "A place for my deep learning studies and experiments."
license = {file = "LICENSE.txt"}
readme = "README.md"
keywords = ["machine", "learning", "deep", "learning", "neural", "networks", "artificial", "intelligence"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "idx2numpy",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "plotly",
    "gensim",
    "kaggle",
    "nltk",
    "tqdm",
    "spacy",
    "scikit-learn",
    "casadi",
    "tensorflow[and-cuda]"
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "flake8",
    "flake8-docstrings"
]
docs = ["sphinx", "sphinx-rtd-theme"]

[tool.setuptools.packages.find]
where = ['.']
include = ['deeplib']
exclude = ['venv', 'tests', "ml_studies"]

[build-system]
requires = [
    "setuptools >= 40.9.0"
]
build-backend = "setuptools.build_meta"

[tool.black]
extend_exclude = '/(\.venv.*)/'
line-length = 88

# pyproject.toml
[tool.pytest.ini_options]
pythonpath = [".", "deeplib"]